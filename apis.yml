    name: Mockaroo API
    description: >-
      REST API for generating realistic mock data records in JSON, CSV, TXT, custom-delimited, SQL, and XML formats.
      Supports saved schemas, inline field specifications, 150+ built-in field types, named datasets as lookup sources,
      and asynchronous background generation jobs for large requests.
