aid: mockaroo
name: Mockaroo
description: >-
  Mockaroo is a realistic mock data generator and API mocking service used by developers and QA teams to produce JSON,
  CSV, TXT, custom-delimited, SQL, and XML test data. The platform combines a schema designer, 150+ built-in field types
  (Name, Internet, Address, Business, Date, Currency, Geographic, Phone, Health, Technology, and more), named datasets
  used as lookup sources, hosted mock APIs, formulas, projects, AI-assisted field generation, de-identification, and a
  REST API for programmatic generation. Mockaroo ships in four tiers (Free, Silver, Gold, Enterprise), with the
  Enterprise tier available as a Docker image for self-hosted, unlimited generation.
