description: >-
  FOCUS-aligned FinOps for Mockaroo: annual tiered subscription with per-key
  daily record and request quotas, plus a flat-fee Enterprise self-hosted
  deployment.
sources:
  - https://www.mockaroo.com/pricing
  - https://www.mockaroo.com/plans
  - https://www.mockaroo.com/docs

alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/

